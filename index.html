<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İnternet Mahkemesi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f111a; color: #f3f4f6; padding: 12px; display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
        header { background: #181b29; border: 1px solid #2d3348; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; color: #c9a227; font-size: 1.1rem; }
        .stats { font-size: 0.8rem; color: #9ca3af; }
        .card { background: #181b29; border: 1px solid #2d3348; padding: 16px; border-radius: 12px; position: relative; }
        .badge { background: rgba(201,162,39,0.2); color: #c9a227; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .title { font-size: 1.2rem; margin: 8px 0; color: #fff; }
        .desc { font-size: 0.95rem; color: #d1d5db; line-height: 1.4; margin-bottom: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
        .timer { color: #ef4444; font-weight: bold; float: right; font-size: 0.9rem; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .vote-btn { padding: 14px 8px; border-radius: 10px; border: 2px solid; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-align: center; }
        .btn-guilty { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #ef4444; }
        .btn-innocent { background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #10b981; }
        .verdict-box { display: none; background: #0f111a; border: 2px solid #c9a227; border-radius: 10px; padding: 16px; text-align: center; margin-top: 12px; }
        .verdict-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 6px; }
        .action-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 0.9rem; }
        .btn-twitter { background: #1da1f2; color: white; }
        .btn-next { background: #c9a227; color: black; }
        .btn-create { background: linear-gradient(135deg, #c9a227, #a3801a); color: black; font-weight: bold; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); padding: 20px; z-index: 1000; align-items: center; justify-content: center; }
        .modal-body { background: #181b29; border: 1px solid #2d3348; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 12px; background: rgba(0,0,0,0.3); border: 1px solid #2d3348; border-radius: 6px; color: white; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚖️ İnternet Mahkemesi</div>
        <div class="stats">Canlı Jüri: <strong style="color:#c9a227;">142</strong></div>
    </header>

    <div class="card">
        <span class="badge">DAVA #4092</span>
        <span class="timer" id="timer">⏱️ 00:45</span>
        <h2 class="title" id="case-title">Süzülmeyen Makarna Faciası</h2>
        <div class="desc" id="case-desc">"Ev arkadaşım dün gece makarna pişirdi ama suyunu süzmeden direkt sosu tencereye boşalttı. Lapa olması lezzet katar diyor. Bu bir mutfak suçudur!"</div>

        <div class="btn-grid" id="vote-buttons">
            <button class="vote-btn btn-guilty" onclick="vote('guilty')">SUÇLU 🔨<br><small id="g-count">%74</small></button>
            <button class="vote-btn btn-innocent" onclick="vote('innocent')">BERAAT 🕊️<br><small id="i-count">%26</small></button>
        </div>

        <div class="verdict-box" id="verdict-box">
            <div class="verdict-title" id="verdict-text" style="color:#ef4444;">SUÇLU</div>
            <p id="verdict-sub" style="font-size:0.85rem; color:#9ca3af; margin-bottom:10px;">Jürilerin %74 oyu ile karar verildi.</p>
            <button class="action-btn btn-twitter" onclick="shareX()">🐦 X'te Paylaş</button>
            <button class="action-btn btn-next" onclick="nextCase()">Sonraki Dava ➡️</button>
        </div>
    </div>

    <button class="action-btn btn-create" onclick="openM()">+ Sen de Dava Aç</button>

    <div class="modal" id="modal">
        <div class="modal-body">
            <h3 style="color:#c9a227;">⚖️ Dava Aç</h3>
            <input type="text" id="m-title" placeholder="Dava Konusu (Örn: Geç Cevap Vermek)">
            <textarea id="m-desc" placeholder="Ne yaşandı? Detayları yaz..."></textarea>
            <button class="action-btn btn-next" onclick="saveM()">Davayı Başlat</button>
            <button class="action-btn" style="background:transparent; color:#9ca3af;" onclick="closeM()">İptal</button>
        </div>
    </div>

    <script>
        let g = 105, i = 37, voted = false, t = 45, interval;

        function startT() {
            clearInterval(interval);
            interval = setInterval(() => {
                if(t > 0) { t--; document.getElementById('timer').innerText = `⏱️ 00:${t < 10 ? '0'+t : t}`; }
                else { clearInterval(interval); showV(); }
            }, 1000);
        }

        function vote(type) {
            if(voted) return;
            voted = true;
            if(type === 'guilty') g++; else i++;
            showV();
        }

        function showV() {
            document.getElementById('vote-buttons').style.display = 'none';
            let box = document.getElementById('verdict-box');
            let isG = g >= i;
            let percent = Math.round(((isG ? g : i) / (g + i)) * 100);
            
            document.getElementById('verdict-text').innerText = isG ? "SUÇLU 🔨" : "BERAAT 🕊️";
            document.getElementById('verdict-text').style.color = isG ? "#ef4444" : "#10b981";
            document.getElementById('verdict-sub').innerText = `Jürilerin %${percent} oyu ile karar verildi.`;
            box.style.display = 'block';
        }

        function nextCase() {
            document.getElementById('verdict-box').style.display = 'none';
            document.getElementById('vote-buttons').style.display = 'grid';
            document.getElementById('case-title').innerText = "Halı Saha Maçına Gelmemek";
            document.getElementById('case-desc').innerText = '"Maça 10 dakika kala evde işim çıktı diyerek gelmedi. 5 kişi oynamak zorunda kaldık."';
            g = 80; i = 5; voted = false; t = 45;
            startT();
        }

        function shareX() {
            let title = document.getElementById('case-title').innerText;
            let txt = encodeURIComponent(`İnternet Mahkemesi Kararını Verdi! ⚖️\n\n"${title}" davasında karar verildi!\n\nSen de jüri ol:`);
            window.open(`https://twitter.com/intent/tweet?text=${txt}`, '_blank');
        }

        function openM() { document.getElementById('modal').style.display = 'flex'; }
        function closeM() { document.getElementById('modal').style.display = 'none'; }
        function saveM() {
            let title = document.getElementById('m-title').value;
            let desc = document.getElementById('m-desc').value;
            if(!title || !desc) return alert("Boş bırakma!");
            document.getElementById('case-title').innerText = title;
            document.getElementById('case-desc').innerText = `"${desc}"`;
            document.getElementById('verdict-box').style.display = 'none';
            document.getElementById('vote-buttons').style.display = 'grid';
            g = 1; i = 0; voted = false; t = 60;
            closeM(); startT();
        }

        startT();
    </script>
</body>
</html>
